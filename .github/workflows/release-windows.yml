name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # cap 0.2.1 vendors the WinPcap import libraries it links. The installed
      # Npcap driver supplies wpcap.dll when the app runs, so the workflow
      # does not download a second SDK.
      - name: Require the capture binding
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/cap/build/Release/cap.node)) { throw "cap binding was not built" }
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
